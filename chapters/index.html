<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Đọc Truyện</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🔥 Thanh neon chạy bám theo -->
  <div id="marquee-bar">
    <div id="marquee-text" class="run">
      ✨ Tác Giả Tú chúc bạn đọc truyện vui vẻ. Thanks ✨
    </div>

    <button id="close-marquee">❌</button>
  </div>

  <h1>📖 Web Đọc Truyện</h1>

  <!-- ✅ Nút chức năng trên -->
  <div class="controls">
    <button id="prev-btn">← Trước</button>
    <button id="chapter-list-btn">📚 Chương</button>
    <button id="next-btn">Sau →</button>
  </div>

  <!-- 📌 Menu chương -->
  <div id="chapter-menu"></div>

  <!-- 🌙 Dark mode -->
  <button id="theme-btn">🌙</button>

  <!-- Nội dung -->
  <h2 id="chapter-title">Chương 1</h2>
  <div id="story-content">Đang tải...</div>

  <!-- ✅ Nút chức năng dưới -->
  <div class="controls bottom">
    <button id="prev-btn2">← Trước</button>
    <button id="next-btn2">Sau →</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
