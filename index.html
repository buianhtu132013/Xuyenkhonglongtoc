<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web Đọc Truyện</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>📖 Web Đọc Truyện</h1>

  <!-- Thanh nút trên -->
  <div class="topBar" id="topBar">
    <button onclick="prevChapter()">⬅</button>

    <select id="chapterSelect" onchange="selectChapter()"></select>

    <button onclick="nextChapter()">➡</button>

    <button onclick="toggleDark()">🌙</button>
  </div>

  <!-- Nội dung truyện -->
  <div id="chapterContent">
    ⏳ Đang tải truyện...
  </div>

  <!-- Thanh nút dưới -->
  <div class="bottomBar">
    <button onclick="prevChapter()">⬅ Chương trước</button>
    <button onclick="nextChapter()">Chương sau ➡</button>
  </div>

  <!-- GỌI FILE JS -->
  <script src="script.js"></script>

</body>
</html>
