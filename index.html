<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Tộc Story</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR MENU CHƯƠNG -->
  <div id="sidebar">
    <h2>📖 Danh sách chương</h2>
    <div id="chapterList"></div>
  </div>

  <!-- MAIN -->
  <div class="container">

    <!-- HEADER -->
    <header>
      <h1>🐉 Long Tộc Cuối Cùng</h1>
      <p>Xuyên Không – Huyền Huyễn – Fantasy Epic</p>
    </header>

    <!-- BUTTON CONTROL -->
    <div class="controls">
      <button onclick="toggleChapterMenu()">📚 Chương</button>
      <button onclick="prevChapter()">⬅ Trước</button>
      <button onclick="nextChapter()">Sau ➡</button>
      <button onclick="increaseFont()">A+</button>
      <button onclick="decreaseFont()">A-</button>
      <button onclick="toggleTheme()">🌙/☀</button>
    </div>

    <!-- CHAPTER CONTENT -->
    <main class="main">
      <h2 id="chapterTitle"></h2>
      <pre id="content"></pre>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
