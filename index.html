<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 Web Đọc Truyện</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Neon chạy -->
  <div id="marqueeBox">
    <marquee id="marqueeText" scrollamount="3">
      ✨ Tác Giả Tú chúc bạn đọc truyện vui vẻ. Thanks ✨
    </marquee>
  </div>

  <header>📖 Web Đọc Truyện</header>

  <!-- Nút chức năng trên -->
  <div class="top-controls" id="topControls">
    <button id="prevBtnTop">⬅ Trước</button>

    <button id="menuBtn">📚 Danh sách chương</button>

    <button id="nextBtnTop">Sau ➡</button>
  </div>

  <!-- Menu chương -->
  <div id="chapterMenu" class="hidden"></div>

  <!-- Nội dung -->
  <div id="content">Đang tải...</div>

  <!-- Nút chức năng dưới -->
  <div class="bottom-controls" id="bottomControls">
    <button id="prevBtnBottom">⬅ Trước</button>
    <button id="nextBtnBottom">Sau ➡</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
