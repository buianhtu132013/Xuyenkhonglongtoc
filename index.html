<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Web Đọc Truyện</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Marquee -->
<div class="marquee">
  ✨ Tác Giả Tú chúc bạn đọc truyện vui vẻ. Thanks ✨

<h1>📖 Web Đọc Truyện</h1>

  <button onclick="toggleMenu()">📚 Danh sách chương</button>

  <button onclick="nextChapter()">Sau ➡</button>
</div>

<!-- Nội dung -->
<h2 id="chapterTitle">Chương 1</h2>
<div id="content">Đang tải...</div>

<!-- Thanh nút dưới -->
<div class="controls bottom">
  <button onclick="prevChapter()">⬅ Trước</button>
  <button onclick="nextChapter()">Sau ➡</button>
</div>

<!-- JS luôn đặt cuối -->
<script src="script.js"></script>

</body>
</html>
