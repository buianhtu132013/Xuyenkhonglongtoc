<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Long Tộc Story</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h1>📖 Long Tộc</h1>

    <button class="menuBtn" onclick="openChapterMenu()">
      📚 Danh sách chương
    </button>

    <div class="controls">
      <button id="prevBtn" onclick="prevChapter()">⬅ Trước</button>
      <button id="nextBtn" onclick="nextChapter()">Sau ➡</button>

      <button onclick="increaseFont()">A+</button>
      <button onclick="decreaseFont()">A-</button>

      <button onclick="toggleTheme()">🌙/☀</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h2 id="chapterTitle">Đang tải...</h2>

    <div id="story">
      Nội dung truyện sẽ hiện ở đây...
    </div>
  </div>

  <!-- Popup Chapter Menu -->
  <div id="chapterMenu" class="chapterMenu">
    <div class="menuBox">
      <h3>Danh sách chương</h3>

      <div id="chapterList"></div>

      <button class="closeBtn" onclick="closeChapterMenu()">Đóng</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
