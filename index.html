<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xuyên Không Long Tộc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>📖 Long Tộc Cuối Cùng</h1>
    <p class="sub">Xuyên Không – Huyền Huyễn – Fantasy Epic</p>
  </header>

  <!-- TOP CONTROL BAR -->
  <div class="controls top-bar" id="topBar">
    <button onclick="prevChapter()">⬅</button>
    <button onclick="nextChapter()">➡</button>
    <button onclick="fontPlus()">A+</button>
    <button onclick="fontMinus()">A-</button>
    <button onclick="toggleTheme()">🌙/☀</button>
    <button onclick="toggleMenu()">📚</button>
  </div>

  <!-- MENU CHƯƠNG -->
  <div class="menu" id="menu">
    <h2>📚 Danh sách chương</h2>
    <div id="chapterList"></div>
  </div>

  <!-- MAIN STORY -->
  <main>
    <h2 id="chapterTitle">Đang tải...</h2>
    <div id="storyBox">
      <pre id="storyText"></pre>
    </div>
  </main>

  <!-- BOTTOM CONTROL BAR -->
  <div class="controls bottom-bar">
    <button onclick="prevChapter()">⬅</button>
    <button onclick="nextChapter()">➡</button>
    <button onclick="fontPlus()">A+</button>
    <button onclick="fontMinus()">A-</button>
    <button onclick="toggleTheme()">🌙/☀</button>
    <button onclick="toggleMenu()">📚</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
